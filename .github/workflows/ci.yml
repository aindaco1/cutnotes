name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
      - name: Test offline development subset (no model or cloud credentials)
        run: python3 scripts/test.py --offline
      - name: Build app and helper
        run: |
          swift build --package-path macos -c release --arch arm64
          binary_root="$(swift build --package-path macos -c release --arch arm64 --show-bin-path)"
          test -x "$binary_root/CutNotes"
          test -x "$binary_root/CutNotesLocal"
          test -d "$binary_root/Sparkle.framework"
